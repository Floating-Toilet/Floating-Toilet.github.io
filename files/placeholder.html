<body onload="setTimeout(goBack, 3000); setInterval(countDown, 1000)">

<script>
    let CountDown = 3
    function goBack() {
        history.go(-1);

    function countDown() {
        CountDown = CountDown - 1;
        document.getElementById("countDown").innerHTML = CountDown;
    }
</script>
